name: PR base branch

# main only receives releases from staging and hotfixes. Everything else targets staging.
on:
  pull_request:
    branches: [main]

jobs:
  check-base:
    name: Only staging or hotfix branches into main
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            staging|hotfix/*) echo "OK: $HEAD_REF -> main" ;;
            *) echo "::error::Pull requests into main must come from staging or hotfix/*. Retarget this one to staging."; exit 1 ;;
          esac
