name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in the .env file}

services:
  db:
    image: postgres:18-alpine
    container_name: ${DB_CONTAINER_NAME:?Set DB_CONTAINER_NAME in the .env file}
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in the .env file}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in the .env file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
    ports:
      - "127.0.0.1:${DB_PORT:?Set DB_PORT in the .env file}:5432"
    volumes:
      # postgres:18+ keeps its data under a per-major-version subdirectory, so the
      # volume must target the parent path: mounting .../data does not persist.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
