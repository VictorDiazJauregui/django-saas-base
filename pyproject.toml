[project]
name = "saas"
version = "0.1.1"
description = "Reusable Django backend base with JWT authentication and request auditing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.17,<5.3",
    "django-environ>=0.14.0,<0.15",
    "djangorestframework>=3.18.1,<3.19",
    "djangorestframework-simplejwt>=5.5.1,<5.6",
    "psycopg[binary]>=3.3.6,<3.4",
]

[dependency-groups]
dev = [
    "black>=25.12.0,<26",
    "django-extensions>=4.1,<5",
    "ipython>=9.9.0,<10",
]

[tool.uv]
package = false

[tool.black]
extend-exclude = "/migrations/"
