[project]
name = "saas"
version = "0.2.1"
description = "Reusable Django backend base with JWT authentication and request auditing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2,<51",
    "django>=5.2.17,<5.3",
    "django-anymail>=15.2,<16",
    "django-axes>=8.3.1,<8.4",
    "django-cors-headers>=4.9.0,<4.10",
    "django-environ>=0.14.0,<0.15",
    "djangorestframework>=3.18.3,<3.19",
    "djangorestframework-simplejwt>=5.5.1,<5.6",
    "drf-spectacular>=0.30.0,<0.31",
    "drf-spectacular-sidecar>=2026.10.1,<2027",
    "gunicorn>=26.2.0,<27",
    "psycopg[binary]>=3.3.6,<3.4",
    "pyotp>=2.10.0,<2.11",
    "whitenoise>=6.12.0,<6.13",
]

[dependency-groups]
dev = [
    "black>=25.12.0,<26",
    "coverage>=7.16.2,<8",
    "django-extensions>=4.1,<5",
    "ipython>=9.9.0,<10",
    "ruff>=0.17.1,<0.18",
]

[tool.uv]
package = false

[tool.black]
extend-exclude = "/migrations/"

[tool.ruff]
# Same as black: migrations are generated code.
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ"]
# black owns line length and does not split strings or comments.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests use fixed passwords as fixture data.
"*/tests/*" = ["S105", "S106"]

[tool.coverage.run]
source = ["."]
branch = true
# The tests never import the server entry points; migrations are generated code; uv puts
# the virtual environment inside the project.
omit = [".venv/*", "*/migrations/*", "*/tests/*", "manage.py", "core/asgi.py", "core/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Measured total, rounded down. Raise it as the tests grow; never lower it to pass the CI.
fail_under = 97
